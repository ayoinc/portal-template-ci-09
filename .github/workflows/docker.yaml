name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image exposes the port nginx listens on; Docker maps it to a free
      # port on the runner.
      - name: Start the container and call the health endpoint
        run: |
          docker run --detach --name app --publish-all app:ci
          address="$(docker port app | head -n 1 | awk '{ print $NF }')"
          echo "address=$address" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://$address/healthz"; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      # A path that is not a file must be answered with the application so
      # that client-side routes survive a page reload.
      - name: Request the page and a client-side route
        run: |
          curl --fail --silent "http://$address/" | grep -q '<div id="root">'
          curl --fail --silent "http://$address/any/client/route" | grep -q '<div id="root">'

      # Reports known vulnerabilities in the image. It does not fail the
      # build: the advisory database changes daily, so the same commit would
      # pass one day and fail the next.
      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL,HIGH

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
