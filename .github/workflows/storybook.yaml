name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm install --no-audit --no-fund

      # Compiles every story; a story that no longer type-checks against its
      # component or fails to bundle breaks this step.
      - name: Build the static Storybook
        run: npm run build-storybook

      - name: Check the build output
        run: |
          test -s storybook-static/index.html
          test -s storybook-static/iframe.html

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7
