server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness endpoint for the container health check and for load balancers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in the name of every file under /assets/, so
    # these files can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a file of the bundle or a client-side route, which is
    # answered with index.html. These responses are revalidated on each request
    # so that a new deployment is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
